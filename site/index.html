<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recetario Monsieur Cuisine</title>
  <meta name="description" content="Buscador y recetario para Monsieur Cuisine con filtro de ingredientes, tiempos, velocidades y temperaturas.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- HEADER / TOPBAR MINIMALISTA -->
  <nav class="w-full glass-nav border-b border-slate-200/80 dark:border-slate-800/80 sticky top-0 z-40 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Logo Directo -->
      <a href="#" class="flex items-center gap-2.5 group flex-shrink-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-amber-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
          <i data-lucide="chef-hat" class="w-5 h-5"></i>
        </div>
        <span class="font-heading font-extrabold text-lg tracking-tight text-slate-900 dark:text-white">
          Monsieur Cuisine <span class="text-brand-600 dark:text-brand-400 font-bold">Recetas</span>
        </span>
      </a>

      <!-- Botones Rápidos -->
      <div class="flex items-center gap-2">
        <button
          id="btnRandomRecipe"
          title="Receta aleatoria"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition-colors"
        >
          <i data-lucide="dices" class="w-4 h-4 text-brand-500"></i>
          <span class="hidden sm:inline">Sorpréndeme</span>
        </button>

        <button
          id="btnToggleFavorites"
          title="Ver recetas favoritas"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition-colors"
        >
          <i data-lucide="heart" class="w-4 h-4 text-rose-500"></i>
          <span class="hidden sm:inline">Favoritas</span>
          <span id="favCounterBadge" class="hidden ml-1 px-1.5 py-0.2 rounded-full text-[10px] font-bold bg-rose-500 text-white">0</span>
        </button>

        <button
          id="btnToggleTheme"
          title="Cambiar tema"
          class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        >
          <i data-lucide="moon" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="sun" class="w-4 h-4 block dark:hidden"></i>
        </button>
      </div>

    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL: SOLO EL BUSCADOR Y FILTROS (SIN EXPLICACIONES PREVIAS) -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-12 space-y-5">

    <!-- BUSCADOR PRINCIPAL PROMINENTE -->
    <div class="max-w-3xl mx-auto w-full">
      <div class="relative group">
        <i data-lucide="search" class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2 group-focus-within:text-brand-500 transition-colors"></i>
        <input
          type="text"
          id="mainSearchInput"
          placeholder="Buscar recetas por nombre, ingrediente o etiqueta... (Pulsa '/' para buscar)"
          class="w-full pl-12 pr-10 py-3.5 sm:py-4 rounded-2xl text-base bg-white dark:bg-slate-900 border-2 border-slate-200/90 dark:border-slate-800 focus:outline-none focus:border-brand-500 dark:focus:border-brand-500 shadow-sm focus:shadow-md transition-all text-slate-900 dark:text-white placeholder-slate-400"
        >
        <button id="btnClearSearch" class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- PANEL DE FILTROS -->
    <div class="space-y-3">
      
      <!-- Fila de Controles (Idioma, Botón de Ingredientes Popup, Dificultad, Tiempo, Robot, Orden) -->
      <div class="bg-white dark:bg-slate-900 rounded-2xl p-3.5 sm:p-4 border border-slate-200/90 dark:border-slate-800 shadow-sm">
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2.5">
          
          <!-- FILTRO POR IDIOMA (ESPAÑOL PREDETERMINADO) -->
          <div>
            <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">
              Idioma
            </label>
            <select
              id="filterLanguage"
              class="w-full text-xs font-semibold py-2 px-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500"
            >
              <option value="es" selected>🇪🇸 Español</option>
              <option value="en">🇬🇧 English</option>
            </select>
          </div>

          <!-- BOTÓN POPUP DE INGREDIENTES -->
          <div>
            <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">
              Ingredientes
            </label>
            <button
              id="btnOpenIngredientsModal"
              type="button"
              class="w-full text-xs font-bold py-2 px-2.5 rounded-xl bg-orange-50 dark:bg-slate-800 border border-orange-200 dark:border-slate-700 hover:border-brand-500 text-brand-700 dark:text-brand-400 hover:bg-orange-100 dark:hover:bg-slate-700/80 transition-all flex items-center justify-between"
            >
              <span class="flex items-center gap-1.5 truncate">
                <i data-lucide="carrot" class="w-3.5 h-3.5 text-brand-500 flex-shrink-0"></i>
                <span>Tus ingredientes</span>
              </span>
              <span id="selectedIngredientsBadge" class="hidden ml-1 px-1.5 py-0.2 rounded-full text-[10px] font-extrabold bg-brand-500 text-white">
                0
              </span>
            </button>
          </div>

          <!-- DIFICULTAD -->
          <div>
            <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">
              Dificultad
            </label>
            <select
              id="filterDifficulty"
              class="w-full text-xs py-2 px-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500"
            >
              <option value="all">Todas</option>
              <option value="1">🟢 Fácil</option>
              <option value="2">🟡 Media</option>
              <option value="3">🔴 Difícil</option>
            </select>
          </div>

          <!-- TIEMPO MÁXIMO -->
          <div>
            <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">
              Tiempo Máx.
            </label>
            <select
              id="filterTime"
              class="w-full text-xs py-2 px-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500"
            >
              <option value="all">Cualquiera</option>
              <option value="30">⚡ &le; 30 min</option>
              <option value="60">⏱️ &le; 60 min</option>
              <option value="90">🍲 &le; 90 min</option>
            </select>
          </div>

          <!-- DISPOSITIVO ROBOT -->
          <div>
            <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">
              Robot
            </label>
            <select
              id="filterDevice"
              class="w-full text-xs font-semibold py-2 px-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500"
            >
              <option value="MC2.0" selected>MC Connect (884)</option>
              <option value="all">Todos los modelos (2.015)</option>
              <option value="MC3.0">MC Smart (930)</option>
            </select>
          </div>

          <!-- ORDENAR POR -->
          <div>
            <label class="block text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">
              Ordenar
            </label>
            <select
              id="filterSort"
              class="w-full text-xs py-2 px-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500"
            >
              <option value="rating">⭐ Mejor valoradas</option>
              <option value="popularity">🔥 Más populares</option>
              <option value="fastest">⚡ Más rápidas</option>
              <option value="title_asc">🔤 Nombre (A-Z)</option>
              <option value="title_desc">🔤 Nombre (Z-A)</option>
            </select>
          </div>

        </div>

        <!-- Chips de Filtros Activos -->
        <div id="activeFiltersRow" class="hidden flex items-center justify-between pt-3 mt-3 border-t border-slate-100 dark:border-slate-800 text-xs">
          <div id="activeFiltersBadges" class="flex flex-wrap items-center gap-1.5"></div>
          <button id="btnResetFilters" class="text-brand-600 dark:text-brand-400 hover:underline font-semibold ml-auto flex items-center gap-1">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            <span>Limpiar filtros</span>
          </button>
        </div>
      </div>

      <!-- Pills de Categorías -->
      <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none no-scrollbar" id="categoriesContainer">
        <!-- Inyectado dinámicamente -->
      </div>

    </div>

    <!-- CABECERA DE RESULTADOS -->
    <div class="flex items-center justify-between pt-1">
      <div class="flex items-center gap-2">
        <h2 id="resultsTitle" class="font-heading font-bold text-lg sm:text-xl text-slate-900 dark:text-white">
          Recetas
        </h2>
        <span id="resultsCountBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold">
          0
        </span>
      </div>
    </div>

    <!-- GRID DE TARJETAS DE RECETAS -->
    <div id="recipesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
      <!-- Tarjetas inyectadas vía JS -->
    </div>

    <!-- ESTADO VACÍO -->
    <div id="emptyState" class="hidden py-16 text-center">
      <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-orange-100 dark:bg-orange-950/60 flex items-center justify-center text-brand-600 dark:text-brand-400">
        <i data-lucide="search-x" class="w-7 h-7"></i>
      </div>
      <h3 class="font-heading font-bold text-base text-slate-900 dark:text-white mb-1">No se encontraron recetas</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 max-w-sm mx-auto mb-4">Prueba con otras palabras o desmarca algunos ingredientes.</p>
      <button id="btnEmptyReset" class="px-4 py-2 text-xs font-semibold rounded-xl bg-brand-600 hover:bg-brand-700 text-white transition-colors">
        Restablecer filtros
      </button>
    </div>

    <!-- BOTÓN CARGAR MÁS -->
    <div id="loadMoreSection" class="mt-8 text-center hidden">
      <button id="btnLoadMore" class="px-6 py-2.5 rounded-full text-xs font-bold bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-brand-500 dark:hover:border-brand-500 text-slate-800 dark:text-slate-200 shadow-sm transition-all inline-flex items-center gap-2">
        <i data-lucide="chevron-down" class="w-4 h-4 text-brand-500"></i>
        <span>Cargar más recetas</span>
      </button>
    </div>

  </main>

  <!-- POPUP / MODAL DE INGREDIENTES (SOLO INGREDIENTES QUE EXISTEN EN LAS RECETAS) -->
  <div id="ingredientsModal" class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/70 backdrop-blur-sm hidden flex items-center justify-center p-3 sm:p-6">
    <div id="ingredientsModalContent" class="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col max-h-[85vh] my-auto animate-scale-up">
      
      <!-- Cabecera del Popup -->
      <div class="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <div>
          <h3 class="font-heading font-bold text-lg text-slate-900 dark:text-white flex items-center gap-2">
            <i data-lucide="carrot" class="w-5 h-5 text-brand-500"></i>
            <span>¿Qué ingredientes tienes?</span>
          </h3>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
            Selecciona ingredientes para ver únicamente las recetas que puedes cocinar.
          </p>
        </div>
        <button id="btnCloseIngredientsModal" class="p-2 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Buscador interno de ingredientes -->
      <div class="px-5 pt-4 pb-2 border-b border-slate-100 dark:border-slate-800/80 bg-slate-50/60 dark:bg-slate-900/60">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input
            type="text"
            id="ingredientSearchInput"
            placeholder="Buscar entre los ingredientes disponibles (ej: pollo, arroz, cebolla, harina...)"
            class="w-full pl-10 pr-9 py-2.5 rounded-xl text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500 text-slate-900 dark:text-white placeholder-slate-400"
          >
          <button id="btnClearIngredientSearch" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- Chips de ingredientes seleccionados -->
        <div id="selectedIngredientsContainer" class="mt-3 flex flex-wrap items-center gap-1.5 max-h-24 overflow-y-auto">
          <!-- Inyectado dinámicamente -->
        </div>
      </div>

      <!-- Lista de ingredientes que existen en las recetas -->
      <div class="p-5 flex-1 overflow-y-auto space-y-4">
        <div>
          <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 mb-2.5">
            <span class="font-semibold uppercase tracking-wider text-[10px]">Ingredientes en el catálogo actual:</span>
            <span id="availableIngredientsCount" class="font-mono text-[11px]">0 ingredientes</span>
          </div>

          <div id="availableIngredientsGrid" class="flex flex-wrap gap-1.5">
            <!-- Inyectado dinámicamente -->
          </div>
        </div>
      </div>

      <!-- Footer del Popup -->
      <div class="p-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/80 flex items-center justify-between gap-3">
        <button
          id="btnClearAllIngredients"
          class="text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-colors"
        >
          Limpiar selección
        </button>

        <button
          id="btnApplyIngredients"
          class="px-5 py-2.5 rounded-xl text-xs font-bold bg-brand-600 hover:bg-brand-700 text-white shadow-md shadow-brand-500/20 transition-all flex items-center gap-1.5"
        >
          <i data-lucide="check" class="w-4 h-4"></i>
          <span id="btnApplyIngredientsText">Aplicar ingredientes</span>
        </button>
      </div>

    </div>
  </div>

  <!-- MODAL DE DETALLE DE RECETA -->
  <div id="recipeModal" class="fixed inset-0 z-50 overflow-y-auto bg-slate-950/70 backdrop-blur-sm hidden flex items-center justify-center p-2 sm:p-4">
    <div id="recipeModalContent" class="relative w-full max-w-4xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden my-6 transform transition-all">
      <!-- Inyectado dinámicamente -->
    </div>
  </div>

  <!-- TEMPORIZADOR FLOTANTE -->
  <div id="floatingTimer" class="fixed bottom-6 right-6 z-40 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl p-3 flex items-center gap-3 hidden">
    <div class="relative w-12 h-12 flex items-center justify-center">
      <svg class="timer-svg w-12 h-12">
        <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="3" fill="none" class="text-slate-200 dark:text-slate-800" />
        <circle id="timerProgressCircle" cx="24" cy="24" r="20" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="125.6" stroke-dashoffset="0" class="text-brand-500" />
      </svg>
      <i data-lucide="timer" class="w-5 h-5 text-brand-600 dark:text-brand-400 absolute"></i>
    </div>
    <div>
      <div class="text-[11px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Temporizador</div>
      <div id="timerDisplay" class="font-heading font-extrabold text-lg text-slate-900 dark:text-white">00:00</div>
    </div>
    <div class="flex items-center gap-1 ml-2">
      <button id="btnTimerPlayPause" class="p-2 rounded-lg bg-brand-50 dark:bg-brand-950/60 text-brand-600 dark:text-brand-400 hover:bg-brand-100 transition-colors" title="Pausar / Reanudar">
        <i data-lucide="pause" id="timerIconPause" class="w-4 h-4"></i>
        <i data-lucide="play" id="timerIconPlay" class="w-4 h-4 hidden"></i>
      </button>
      <button id="btnTimerStop" class="p-2 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" title="Cerrar temporizador">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <audio id="timerAudio" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
  </audio>

  <script src="app.js?v=3"></script>
</body>
</html>
